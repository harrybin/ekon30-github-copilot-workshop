name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fp-compiler lcl-utils lazarus-src
      - run: npm test
      - run: npm run build
      - run: npm run test:fpc
      - run: npm run test:guide
